<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCM 截肢校正計算 / Amputation Correction</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1d21;--mu:#5f6874;--ac:#0b6e99;--bd:#d5d9df;--ok:#e7f4ea;--wa:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1f2428;--tx:#eceff2;--mu:#9aa4af;--ac:#5cb8e0;--bd:#38404a;--ok:#1d3326;--wa:#3a3218}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:560px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mu);font-size:.85rem;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin-bottom:4px}
select,input{width:100%;padding:11px;font-size:1.05rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r{margin-top:6px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{border-radius:10px;padding:12px;background:var(--ok);text-align:center}
.b small{display:block;color:var(--mu)}
.b strong{font-size:1.9rem;color:var(--ac)}
.b span{font-size:.8rem;color:var(--mu)}
.n{background:var(--wa);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-top:8px}
.f{font-size:.78rem;color:var(--mu)}
#go{width:100%;padding:14px;margin-bottom:12px;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
#go:active{opacity:.8}
code{font-size:.82rem;word-break:break-all}
</style>
</head>
<body>
<div class="w">
<h1>BCM 截肢校正計算</h1>
<div class="sub">Fresenius BCM fact sheet – Amputations (OH / V)</div>

<div class="c g">
  <div><label for="L">左腳 Left leg</label>
  <select id="L"><option value="0">無截肢 None</option><option value="1">BKA 膝下</option><option value="2">AKA 膝上</option><option value="3">全腿 Whole leg</option></select></div>
  <div><label for="R">右腳 Right leg</label>
  <select id="R"><option value="0">無截肢 None</option><option value="1">BKA 膝下</option><option value="2">AKA 膝上</option><option value="3">全腿 Whole leg</option></select></div>
</div>

<div class="c g">
  <div><label for="oh">Measured OH (L)</label><input id="oh" type="number" step="0.1" inputmode="decimal" placeholder="例 4.0"></div>
  <div><label for="v">Measured V (L)</label><input id="v" type="number" step="0.1" inputmode="decimal" placeholder="例 65"></div>
</div>

<button id="go" type="button">Calculate 計算</button>

<div class="c">
  <div class="res">
    <div class="b"><small>Corrected OH</small><strong id="ohr">–</strong> L</div>
    <div class="b"><small>Corrected V</small><strong id="vr">–</strong> L</div>
  </div>
  <div id="msg"></div>
  <div class="r f" id="calc"></div>
</div>

<div class="f">公式 Formula:校正值 = 測量值 − Σ(測量值 − 表內校正值)。表內數值之間以線性內插計算(表格以外的內插為本工具假設)。OH &gt; 8 L 時按手寫備註採用 8 L 數據。僅供參考,請與原始 fact sheet 核對。<br>Reference only; verify against the original fact sheet.</div>
</div>

<script>
// [measured, BK, AK, whole]
const OH=[[-4,-4.0,-4.0,-3.7],[-3,-3.0,-3.0,-2.9],[-2,-2.1,-2.1,-2.0],[-1,-1.1,-1.1,-1.2],[0,-0.2,-0.2,-0.3],[1,0.8,0.8,0.5],[1.5,1.3,1.3,0.9],[2,1.7,1.7,1.4],[2.5,2.2,2.2,1.8],[3,2.7,2.6,2.2],[3.5,3.2,3.1,2.6],[4,3.6,3.6,3.0],[4.5,4.1,4.0,3.5],[5,4.6,4.5,3.9],[5.5,5.1,5.0,4.3],[6,5.5,5.5,4.7],[6.5,6.0,5.9,5.1],[7,6.5,6.4,5.6],[7.5,7.0,6.9,6.0],[8,7.4,7.3,6.1]];
const V=[[10,9.4,9.2,8.2],[15,14.2,13.9,12.4],[20,18.9,18.5,16.6],[25,23.7,23.2,20.8],[30,28.4,27.8,25.0],[35,33.2,32.5,29.2],[40,37.9,37.1,33.4],[45,42.7,41.8,37.6],[50,47.4,46.4,41.8],[55,52.2,51.1,46.0],[60,56.9,55.7,50.2],[65,61.7,60.4,54.4],[70,66.4,65.0,58.6],[75,71.2,69.7,62.8],[80,75.9,74.3,67.0]];
const NAME=["","BKA","AKA","Whole"];
const $=id=>document.getElementById(id);

function lookup(T,m,col){
  for(let i=0;i<T.length;i++){
    if(m===T[i][0])return T[i][col];
    if(i<T.length-1&&m>T[i][0]&&m<T[i+1][0]){
      const a=T[i],b=T[i+1],t=(m-a[0])/(b[0]-a[0]);
      return a[col]+t*(b[col]-a[col]);
    }
  }
  return null;
}
// returns {val, text, note}
function correct(T,m,legs,isOH){
  const lo=T[0][0],hi=T[T.length-1][0];
  let note="",mm=m;
  if(isOH&&m>hi){mm=hi;note="OH &gt; 8 L:按備註採用 8 L 數據計算。";}
  else if(m<lo||m>hi){return{err:"測量值超出表格範圍 ("+lo+" – "+hi+" L)"};}
  let r=m,parts=[];
  for(const l of legs){
    const c=lookup(T,mm,l);
    r-=(m-c);
    parts.push(NAME[l]+" "+c.toFixed(1));
  }
  return{val:r,note,parts};
}
function run(){
  const L=+$("L").value,R=+$("R").value;
  const legs=[L,R].filter(x=>x>0);
  const oh=parseFloat($("oh").value),v=parseFloat($("v").value);
  let msg="",calc="";
  const out=(el,res,m,unit)=>{
    if(res.err){$(el).textContent="–";msg+='<div class="n">'+(el==="ohr"?"OH":"V")+": "+res.err+"</div>";return;}
    $(el).textContent=res.val.toFixed(1);
    if(res.note)msg+='<div class="n">'+res.note+"</div>";
    calc+="<code>"+(el==="ohr"?"OH":"V")+": "+m+(res.parts.length?" − ("+res.parts.map(p=>m+" − "+p.split(" ")[1]).join(") − ("):"")+(res.parts.length?")":"")+" = "+res.val.toFixed(1)+" L</code><br>";
  };
  $("ohr").textContent="–";$("vr").textContent="–";
  if(!legs.length){
    msg='<div class="n">請選擇至少一隻截肢的腳。</div>';
  }else{
    if(!isNaN(oh))out("ohr",correct(OH,oh,legs,true),oh);
    if(!isNaN(v))out("vr",correct(V,v,legs,false),v);
  }
  $("msg").innerHTML=msg;$("calc").innerHTML=calc;
}
function clr(){$("ohr").textContent="–";$("vr").textContent="–";$("msg").innerHTML="";$("calc").innerHTML="";}
["L","R","oh","v"].forEach(i=>$(i).addEventListener("input",clr));
["oh","v"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")run();}));
$("go").addEventListener("click",run);
</script>
</body>
</html>
